services:
  llama-paddock:
    image: ghcr.io/splendidchip758/llama-paddock:latest
    # build: ./dashboard   # build locally instead of pulling
    container_name: llama-paddock
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - paddock-data:/data # hosts added in the UI + login; keep it across upgrades
      # Optional: settings and read-only hosts from a file (see config.example.yaml)
      # - ./config.yaml:/config/config.yaml:ro

volumes:
  paddock-data:
