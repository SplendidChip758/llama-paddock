# Dependabot version updates:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Commit prefixes are chosen for semantic-release: updates that change what
# ships (dashboard runtime deps, the Docker base image) are fix(deps) and cut a
# patch release; dev deps and GitHub Actions are chore/ci and don't.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      dashboard-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Track the Node major the dashboard runs on (node:22 in the Dockerfile).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      include: "scope"
    ignore:
      # Move to a new Node major deliberately, not via Dependabot.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
