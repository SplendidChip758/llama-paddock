# On pushes to main that touch shipped code, semantic-release reads the
# Conventional Commits since the last v* tag and, if any warrant a release:
# bumps the version in the dashboard and agents, updates CHANGELOG.md, commits
# that back to main, tags vX.Y.Z and creates a GitHub release with the
# dashboard tarball (used by install/dashboard.sh), both agents and SHA256SUMS.
# The docker job then publishes that version's image to GHCR.
# Config: .releaserc.json
#
# Docs, install scripts (served from main, not from releases), compose and
# example config never trigger a run. Releasable commits that only touch those
# are still picked up in the changelog of the next release.
name: release

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "agent/**"
      - ".releaserc.json"
      - ".github/workflows/release.yml"
      - ".github/scripts/prepare-release.sh"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release@25
          -p @semantic-release/changelog@7
          -p @semantic-release/git@11
          -p @semantic-release/exec@7
          -p conventional-changelog-conventionalcommits@9
          semantic-release

  docker:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
