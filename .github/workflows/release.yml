# On pushes to main or dev that touch shipped code, semantic-release reads the
# Conventional Commits since the last v* tag and, if any warrant a release:
# bumps the version in the dashboard and agents, updates CHANGELOG.md, commits
# that back to the branch, tags it and creates a GitHub release with the
# dashboard tarball (used by install/dashboard.sh), both agents and SHA256SUMS.
# The docker jobs then publish that version's image to GHCR.
# Config: .releaserc.json
#
#   main → vX.Y.Z           stable release, images :X.Y.Z, :X.Y and :latest
#   dev  → vX.Y.Z-dev.N     GitHub prerelease, images :X.Y.Z-dev.N and :dev
#
# Each architecture is built on a native runner (arm64 under QEMU took ~35 min
# and crashed npm), pushed by digest, then merged into one multi-arch tag.
#
# Docs, install scripts (served from main, not from releases), compose and
# example config never trigger a run. Releasable commits that only touch those
# are still picked up in the changelog of the next release.
name: release

on:
  push:
    branches: [main, dev]
    paths:
      - "dashboard/**"
      - "agent/**"
      - ".releaserc.json"
      - ".github/workflows/release.yml"
      - ".github/scripts/prepare-release.sh"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semrel.outputs.version }}
      prerelease: ${{ contains(steps.semrel.outputs.version, '-') }}
    steps:
      # main and dev only accept PRs; the deploy key is the rulesets' bypass, so
      # semantic-release can push the release commit and tag over SSH.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release@25
          -p @semantic-release/changelog@7
          -p @semantic-release/git@11
          -p @semantic-release/exec@7
          -p conventional-changelog-conventionalcommits@9
          semantic-release

  docker-build:
    needs: release
    if: needs.release.outputs.version != ''
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TAG: v${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # GHCR names must be lowercase
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}},value=${{ env.TAG }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./dashboard
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: [release, docker-build]
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.release.outputs.version }}
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # semver {{major}}.{{minor}} is skipped for prereleases automatically
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ needs.release.outputs.prerelease == 'false' }}
            type=raw,value=dev,enable=${{ needs.release.outputs.prerelease == 'true' }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
