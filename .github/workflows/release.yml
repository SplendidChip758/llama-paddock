# On a version tag (v1.2.3): build the dashboard once and attach it to a GitHub
# release (used by install/dashboard.sh), attach the agents, and publish the
# Docker image to GHCR. Normally called by release-please.yml; pushing a tag by
# hand still works.
name: release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Package release assets
        run: |
          mkdir -p dist/llama-paddock-dashboard/.next
          cp -a dashboard/.next/standalone/. dist/llama-paddock-dashboard/
          cp -a dashboard/.next/static dist/llama-paddock-dashboard/.next/static
          echo "${TAG}" > dist/llama-paddock-dashboard/VERSION
          tar -C dist -czf "dist/llama-paddock-dashboard-${TAG}.tar.gz" llama-paddock-dashboard
          cp agent/linux/paddock-agent.mjs dist/paddock-agent-linux.mjs
          cp agent/windows/paddock-agent.mjs dist/paddock-agent-windows.mjs
          (cd dist && sha256sum *.tar.gz *.mjs > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/llama-paddock-dashboard-*.tar.gz
            dist/paddock-agent-linux.mjs
            dist/paddock-agent-windows.mjs
            dist/SHA256SUMS

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
