# On every push to main, release-please reads the conventional commits since the
# last release and keeps a "chore(main): release x.y.z" PR open that bumps the
# version (dashboard/package.json, both agents) and updates CHANGELOG.md.
# Merging that PR tags vX.Y.Z, creates the GitHub release, and runs release.yml.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags pushed with GITHUB_TOKEN don't trigger other workflows, so call the
  # release build directly.
  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
