# Build checks for every pull request. The rulesets on main and dev require
# these jobs, so they run on every PR (no path filters): a required check that
# never starts would block docs-only PRs forever. A job skipped by its `if`
# counts as passed.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # behaviour checks: the build above against simulated Ollama hosts and agents (test/sim)
      - run: npm run test:scenarios

  # browser tests (test/e2e): Playwright drives Chromium against the build and the simulator. A job of
  # its own, so it runs alongside the scenario tests and a failure says which side broke.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            test/e2e/package-lock.json

      - name: Build the dashboard
        working-directory: dashboard
        run: npm ci && npm run build

      - name: Install Playwright
        working-directory: test/e2e
        run: npm ci

      - name: Playwright version
        id: pw
        working-directory: test/e2e
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # the browser comes from the cache when it can; the system libraries it needs never do
      - name: Install Chromium
        working-directory: test/e2e
        env:
          CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [[ $CACHED == true ]]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Browser tests
        working-directory: test/e2e
        run: npm test

      # traces, screenshots and videos of failed tests: unzip and run `npx playwright show-report`
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results/
          retention-days: 14

  # The rulesets require a check named "agents". The agents themselves are checked in
  # SplendidChip758/llama-paddock-agent; the scenario tests run the dashboard against one.
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Shell scripts parse
        run: for f in install/*.sh .github/scripts/*.sh; do bash -n "$f"; done

  # PRs into main are merged with a merge commit, so every commit in them reaches
  # semantic-release, not just the PR title. PRs into dev are squash-merged, and
  # the pr-title check covers them.
  commits:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Conventional commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          types='feat|fix|perf|revert|docs|refactor|style|test|build|ci|chore'
          bad=$(git log --no-merges --format='%h %s' "$BASE..$HEAD" \
            | grep -Ev "^[0-9a-f]+ (($types)(\([a-z0-9-]+\))?!?: .+|Revert \")" || true)
          if [[ -n $bad ]]; then
            echo "::error::These commits aren't Conventional Commits (see CONTRIBUTING.md):"
            echo "$bad"
            exit 1
          fi
